[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vachaka"
dynamic = ["version"]
description = "High-level Sanskrit recitation from text: Vāgdhenu chant and prose voices with pāda timings"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev', 'sanskrit', 'tts', 'chant', 'recitation']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastcore>=1.8",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "f5-tts @ git+https://github.com/ai4bharat/IndicF5.git@13f7c4d627cc10111aea8fe9c0039462cacacdc7",
    "transformers==4.46.3",
    "accelerate==0.34.2",
    "vocos==0.1.0",
    "x-transformers==2.19.7",
    "numpy==1.26.4",
    "librosa==0.11.0",
    "soundfile",
    "huggingface_hub",
    "indic-transliteration",
]

[project.urls]
Repository = "https://github.com/vedicreader/vachaka"
Documentation = "https://vedicreader.github.io/vachaka/"

[project.scripts]
vachaka-recite = "vachaka.recite:recite_cli"

[project.entry-points.nbdev]
vachaka = "vachaka._modidx:d"

[project.optional-dependencies]
check = [
    "nemo-toolkit[asr]>=2.1.0",
]

[tool.nbdev]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["vachaka"]

[tool.hatch.build.targets.sdist]
include = ["/vachaka", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "vachaka/__init__.py"

[dependency-groups]
dev = ["nbdev>=3.3.4", "ipykernel"]
